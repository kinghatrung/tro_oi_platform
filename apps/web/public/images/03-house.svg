<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>House</title>
  <g stroke="#0E2F35" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">

    <!-- tree -->
    <ellipse cx="94" cy="306" rx="40" ry="50" fill="#1FA98F"/>
    <line x1="94" y1="432" x2="94" y2="296" stroke-width="10"/>
    <line x1="94" y1="336" x2="74" y2="314" stroke-width="10"/>
    <line x1="94" y1="350" x2="114" y2="328" stroke-width="10"/>

    <!-- chimney -->
    <rect x="316" y="112" width="32" height="118" fill="#E4F4EF"/>
    <rect x="304" y="96" width="56" height="22" fill="#1FA98F"/>

    <!-- house body + gable -->
    <path d="M152 432 V222 L256 130 L360 222 V432 Z" fill="#FBFFFE"/>

    <!-- roof band -->
    <path d="M256 104 L400 232 L400 268 L256 140 L112 268 L112 232 Z" fill="#1FA98F"/>

    <!-- round gable window -->
    <circle cx="256" cy="200" r="24" fill="#E4F4EF"/>
    <line x1="256" y1="178" x2="256" y2="222" stroke-width="8"/>
    <line x1="234" y1="200" x2="278" y2="200" stroke-width="8"/>

    <!-- door -->
    <path d="M186 432 V316 h62 v116 z" fill="#1FA98F"/>
    <circle cx="236" cy="376" r="6" fill="#E4F4EF" stroke="none"/>

    <!-- window -->
    <rect x="278" y="312" width="66" height="60" fill="#A9DCDD"/>
    <line x1="311" y1="312" x2="311" y2="372" stroke-width="8"/>
    <line x1="278" y1="342" x2="344" y2="342" stroke-width="8"/>

    <!-- base step -->
    <rect x="166" y="410" width="180" height="22" fill="#E4F4EF"/>

    <!-- bushes -->
    <path d="M300 432 a34 34 0 0 1 68 0 z" fill="#1FA98F"/>
    <path d="M350 432 a28 28 0 0 1 56 0 z" fill="#9FD9C4"/>
    <path d="M110 432 a28 28 0 0 1 56 0 z" fill="#9FD9C4"/>

    <!-- ground -->
    <line x1="64" y1="432" x2="460" y2="432" stroke-width="14"/>
  </g>
</svg>
