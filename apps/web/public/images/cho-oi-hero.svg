<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="220" viewBox="0 0 1600 220" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Khu chợ đồ cũ">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3c4"/>
      <stop offset="1" stop-color="#fff5ea"/>
    </linearGradient>
    <!-- Sạp hàng: mái sọc + cột + quầy -->
    <g id="stall">
      <rect x="10" y="30" width="8" height="120" fill="#9a3412"/>
      <rect x="222" y="30" width="8" height="120" fill="#9a3412"/>
      <rect x="0" y="0" width="40" height="30" fill="#ea580c"/>
      <rect x="40" y="0" width="40" height="30" fill="#fff"/>
      <rect x="80" y="0" width="40" height="30" fill="#ea580c"/>
      <rect x="120" y="0" width="40" height="30" fill="#fff"/>
      <rect x="160" y="0" width="40" height="30" fill="#ea580c"/>
      <rect x="200" y="0" width="40" height="30" fill="#fff"/>
      <path d="M0 30a20 12 0 0 0 40 0Z" fill="#ea580c"/>
      <path d="M40 30a20 12 0 0 0 40 0Z" fill="#fff"/>
      <path d="M80 30a20 12 0 0 0 40 0Z" fill="#ea580c"/>
      <path d="M120 30a20 12 0 0 0 40 0Z" fill="#fff"/>
      <path d="M160 30a20 12 0 0 0 40 0Z" fill="#ea580c"/>
      <path d="M200 30a20 12 0 0 0 40 0Z" fill="#fff"/>
      <rect x="4" y="108" width="232" height="42" rx="3" fill="#fdba74"/>
      <rect x="4" y="108" width="232" height="8" rx="3" fill="#c2410c"/>
    </g>
    <!-- Đồ trên quầy -->
    <g id="goods-a">
      <rect x="30" y="72" width="44" height="36" rx="3" fill="#7c2d12"/>
      <rect x="35" y="77" width="34" height="24" rx="2" fill="#fed7aa"/>
      <rect x="92" y="62" width="34" height="46" rx="4" fill="#fff"/>
      <path d="M92 80h34" stroke="#c2410c" stroke-width="2"/>
      <rect x="146" y="92" width="58" height="8" rx="2" fill="#ea580c"/>
      <rect x="150" y="84" width="50" height="8" rx="2" fill="#7c2d12"/>
      <rect x="146" y="100" width="58" height="8" rx="2" fill="#fb923c"/>
    </g>
    <g id="goods-b">
      <path d="M36 62h30l8 26H28Z" fill="#fb923c"/>
      <rect x="49" y="88" width="4" height="20" fill="#7c2d12"/>
      <path d="M92 88a10 10 0 0 1 10-10h34a10 10 0 0 1 10 10v20H92Z" fill="#c2410c"/>
      <rect x="104" y="84" width="30" height="14" rx="3" fill="#fed7aa"/>
      <rect x="166" y="70" width="36" height="38" rx="3" fill="#d97706"/>
      <path d="M166 84h36M184 70v14" stroke="#7c2d12" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1600" height="220" fill="url(#sky)"/>
  <circle cx="1240" cy="112" r="38" fill="#ffd8a8"/>

  <!-- Dãy nhà xa -->
  <g fill="#ffd9b3">
    <rect x="330" y="120" width="70" height="100"/>
    <rect x="410" y="90" width="52" height="130"/>
    <rect x="470" y="130" width="90" height="90"/>
    <rect x="1040" y="130" width="84" height="90"/>
    <rect x="1132" y="96" width="56" height="124"/>
    <rect x="1196" y="124" width="72" height="96"/>
  </g>

  <!-- Sạp hàng hai bên -->
  <g transform="translate(20 70)"><use href="#stall"/><use href="#goods-a"/></g>
  <g transform="translate(1340 70)"><use href="#stall"/><use href="#goods-b"/></g>
  <g transform="translate(1090 92) scale(.85)"><use href="#stall"/><use href="#goods-a"/></g>
  <g transform="translate(270 92) scale(.85)"><use href="#stall"/><use href="#goods-b"/></g>

  <rect y="208" width="1600" height="12" fill="#fb923c"/>
</svg>
