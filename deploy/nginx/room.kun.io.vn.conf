# /etc/nginx/sites-available/room.kun.io.vn  (symlink vào sites-enabled)
# Trọ ơi: room.kun.io.vn → web container, room-api.kun.io.vn → API container (REST + Socket.IO).
# Cả hai container chỉ nghe 127.0.0.1 (xem /opt/tro-oi/docker-compose.yml).
#
# Như portfolio: cài file này nguyên trạng (chỉ cổng 80), rồi chạy
#   certbot --nginx -d room.kun.io.vn -d room-api.kun.io.vn
# certbot tự chuyển sang 443 với chứng chỉ Let's Encrypt và thêm chuyển hướng 80 → 443.

# Tên riêng để không trùng map/upstream của site khác trên máy (Mivo dùng nimbo_*).
map $http_upgrade $trooi_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream trooi_api {
    server 127.0.0.1:5200;
    keepalive 16;
}

upstream trooi_web {
    server 127.0.0.1:3200;
    keepalive 16;
}

server {
    listen 80;
    server_name room.kun.io.vn;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location / {
        proxy_pass http://trooi_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr; # IP thật (cloudflare-realip.conf)
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}

server {
    listen 80;
    server_name room-api.kun.io.vn;

    server_tokens off;
    # Ảnh ≤ 5 MB/file, video tin đăng ≤ 50 MB (VIDEO_MAX_MB); mặc định nginx chỉ 1 MB
    client_max_body_size 60m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/plain application/json;

    # proxy_set_header KHÔNG kế thừa vào location tự đặt header → mỗi location viết lại đủ bộ.

    # Realtime (Socket.IO namespace /chat): giữ kết nối lâu
    location /socket.io/ {
        proxy_pass http://trooi_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $trooi_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://trooi_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
    }
}
